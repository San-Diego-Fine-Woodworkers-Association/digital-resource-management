services:
  resourcespace:
    build: .
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - STAGE=${STAGE}
      - MYSQL_SERVER=${MYSQL_SERVER}
      - MYSQL_ROOT_USER=${MYSQL_ROOT_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_READ_ONLY_USER=${MYSQL_READ_ONLY_USER}
      - MYSQL_READ_ONLY_PASSWORD=${MYSQL_READ_ONLY_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DB_NAME=${DB_NAME}
      - SCRAMBLE_KEY=${SCRAMBLE_KEY}
      - API_SCRAMBLE_KEY=${API_SCRAMBLE_KEY}
      - EMAIL_NOTIFY=${EMAIL_NOTIFY}
      - EMAIL_FROM=${EMAIL_FROM}
      - SIMPLESAML_ADMIN_PASSWORD_HASH=${SIMPLESAML_ADMIN_PASSWORD_HASH}
      - CLIP_SERVICE_URL=http://clip:8000
      - FACES_SERVICE_URL=http://faces:8001
    depends_on:
      - mariadb
      - clip
      - faces
    volumes:
      - rs_assets:/var/www/html/filestore
    networks:
      - frontend
      - backend
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resourcespace.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.resourcespace.entrypoints=websecure"
      - "traefik.http.routers.resourcespace.tls.certresolver=letsencrypt"
      - "traefik.http.services.resourcespace.loadbalancer.server.port=80"

  clip:
    build: ./clip
    restart: unless-stopped
    # Hard memory cap so a spike can only kill this container, never starve
    # Apache/MariaDB (the 2026-10-05 upload failures, #25). Measured: ~1 GB
    # resident when idle, ~2.2 GB peak while loading the model at startup
    # (page cache counts toward the cap but is reclaimed before an OOM kill).
    # The handlers block the event loop during inference, so the service
    # already processes one image at a time and concurrent uploads queue.
    # If CLIP is down, RS skips the vector and cron backfills it later.
    mem_limit: 2560m
    environment:
      - CLIP_DB_HOST=mariadb
      - CLIP_DB_USER=${MYSQL_ROOT_USER}
      - CLIP_DB_PASS=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mariadb
    volumes:
      - clip_cache:/root/.cache
    networks:
      - backend

  faces:
    build: ./faces
    restart: unless-stopped
    # Hard memory cap; see the clip service. Measured: ~1.1 GB resident when
    # idle, ~1.6 GB peak.
    mem_limit: 2g
    environment:
      - FACES_DB_HOST=mariadb
      - FACES_DB_USER=${MYSQL_ROOT_USER}
      - FACES_DB_PASS=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mariadb
    volumes:
      - faces_models:/root/.insightface
    networks:
      - backend

  mariadb:
    image: mariadb
    restart: unless-stopped
    environment:
      - DB_HOST=mariadb
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MYSQL_DATABASE}
      - MARIADB_USER=${MYSQL_READ_ONLY_USER}
      - MARIADB_PASSWORD=${MYSQL_READ_ONLY_PASSWORD}
      - SCRAMBLE_KEY=${SCRAMBLE_KEY}
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - backend

  adminer:
    image: adminer
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # Backup sidecar: stages consistent DB dumps + a filestore mirror onto the
  # `backups` volume on a schedule. An off-site box pulls that volume over
  # rsync/SSH. See docs/backups.md and docs/onprem-pull-setup.md.
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      - TZ=${BACKUP_TZ:-America/Los_Angeles}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_ON_START=${BACKUP_ON_START:-false}
      # Optional: an age public key. If set, an encrypted secrets snapshot is
      # included in each backup so it is self-contained. Leave blank to skip.
      - BACKUP_SECRETS_AGE_RECIPIENT=${BACKUP_SECRETS_AGE_RECIPIENT:-}
      # Optional off-site push (copy 2) to a Storage Box or similar rsync/SSH
      # target. Leave STORAGE_BOX_HOST blank to stage locally only, as before.
      # See docs/storagebox-setup.md.
      - STORAGE_BOX_HOST=${STORAGE_BOX_HOST:-}
      - STORAGE_BOX_USER=${STORAGE_BOX_USER:-}
      - STORAGE_BOX_PORT=${STORAGE_BOX_PORT:-23}
      - STORAGE_BOX_REMOTE_PATH=${STORAGE_BOX_REMOTE_PATH:-./resourcespace/}
      # Secrets — a private key (RW sub-account) and its pinned host key line,
      # written to disk by entrypoint.sh at container start. Never in git.
      # The private key is BASE64-ENCODED (see docs/storagebox-setup.md) since
      # Dokploy's Environment tab, like a .env file, parses one KEY=VALUE per
      # line — a raw multi-line PEM block would get corrupted.
      - STORAGE_BOX_SSH_KEY_B64=${STORAGE_BOX_SSH_KEY_B64:-}
      - STORAGE_BOX_HOST_KEY=${STORAGE_BOX_HOST_KEY:-}
      # DB connection (root, for a full dump) + secrets for the optional snapshot.
      - MYSQL_SERVER=${MYSQL_SERVER}
      - MYSQL_ROOT_USER=${MYSQL_ROOT_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_READ_ONLY_USER=${MYSQL_READ_ONLY_USER}
      - MYSQL_READ_ONLY_PASSWORD=${MYSQL_READ_ONLY_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DB_NAME=${DB_NAME}
      - SCRAMBLE_KEY=${SCRAMBLE_KEY}
      - API_SCRAMBLE_KEY=${API_SCRAMBLE_KEY}
      - EMAIL_NOTIFY=${EMAIL_NOTIFY}
      - EMAIL_FROM=${EMAIL_FROM}
      - SIMPLESAML_ADMIN_PASSWORD_HASH=${SIMPLESAML_ADMIN_PASSWORD_HASH}
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      - mariadb
    volumes:
      - rs_assets:/data/filestore:ro   # read-only: the sidecar never writes assets
      - backups:/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 15m

  # Member Media Upload (issue #33): the gated page and narrow API at
  # https://${DOMAIN_NAME}/upload. Source and Dockerfile in upload/. Only
  # /upload is routed here; ResourceSpace keeps every other path.
  # Locked down per issue #23: non-root (USER in upload/Dockerfile), read-only
  # root filesystem, no capabilities, resource limits, and only the networks
  # that reach Traefik and ResourceSpace (never mariadb, clip or faces).
  upload:
    build: ./upload
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    # The audit trail and the service's log go to the container log, on the
    # root disk; the host has no default rotation. Bounded at 100 MB (about
    # 300 000 audit lines), so no flood can fill the disk (#60).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - PUBLIC_BASE_URL=https://${DOMAIN_NAME}
      - AUTH_BASE_URL=${UPLOAD_AUTH_BASE_URL:-https://auth.sdfwa.org}
      # ResourceSpace straight over the Docker network, answering as the public
      # host (#17). Fallback if it refuses that: https://${DOMAIN_NAME}.
      - RS_BASE_URL=${UPLOAD_RS_BASE_URL:-http://resourcespace}
      # The least-privilege upload-service user (#34) and its API key, a
      # Dokploy secret. Deliberately no `:?`: if the key is missing, the
      # service starts and shows the temporary-problem page instead of failing
      # the whole compose deploy.
      - RS_UPLOADER_USER=${RS_UPLOADER_USER:-upload-service}
      - RS_UPLOADER_API_KEY=${RS_UPLOADER_API_KEY:-}
      - RENEW_URL=${UPLOAD_RENEW_URL:-https://sdfwa.org/sdfwa-membership-levels/}
      # The kill switch: anything but false/0/no/off pauses uploads.
      - UPLOADS_PAUSED=${UPLOADS_PAUSED:-false}
      - STAGING_DIR=/staging
    volumes:
      # The dedicated staging volume (ADR 0004, issue #35), owned by
      # 10001:10001 on the host. Required: there is deliberately no default,
      # so staging can never land on the root disk by accident.
      - type: bind
        source: ${UPLOAD_STAGING_PATH:?set UPLOAD_STAGING_PATH to the upload staging volume mount (issue 35)}
        target: /staging
    networks:
      - frontend
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.media-upload.rule=Host(`${DOMAIN_NAME}`) && (Path(`/upload`) || PathPrefix(`/upload/`))"
      - "traefik.http.routers.media-upload.priority=100"
      - "traefik.http.routers.media-upload.entrypoints=websecure"
      - "traefik.http.routers.media-upload.tls.certresolver=letsencrypt"
      - "traefik.http.services.media-upload.loadbalancer.server.port=8080"

networks:
  frontend:
  backend:
  dokploy-network:
    external: true

volumes:
  # mariadb/rs_assets/backups are bind-mounted onto the attached Hetzner
  # Volume (mounted at DATA_VOLUME_PATH on the host) instead of living under
  # Docker's default /var/lib/docker on the root disk — those are the three
  # that actually grow over time. clip_cache/faces_models are small model
  # caches and stay on the root disk as ordinary named volumes.
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_VOLUME_PATH:-/mnt/HC_Volume_105523521}/mariadb
  rs_assets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_VOLUME_PATH:-/mnt/HC_Volume_105523521}/filestore
  clip_cache:
  faces_models:
  backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_VOLUME_PATH:-/mnt/HC_Volume_105523521}/backups
