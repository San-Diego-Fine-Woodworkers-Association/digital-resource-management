services:
  resourcespace:
    build: .
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - STAGE=${STAGE}
      - MYSQL_SERVER=${MYSQL_SERVER}
      - MYSQL_ROOT_USER=${MYSQL_ROOT_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_READ_ONLY_USER=${MYSQL_READ_ONLY_USER}
      - MYSQL_READ_ONLY_PASSWORD=${MYSQL_READ_ONLY_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DB_NAME=${DB_NAME}
      - SCRAMBLE_KEY=${SCRAMBLE_KEY}
      - API_SCRAMBLE_KEY=${API_SCRAMBLE_KEY}
      - EMAIL_NOTIFY=${EMAIL_NOTIFY}
      - EMAIL_FROM=${EMAIL_FROM}
      - SIMPLESAML_ADMIN_PASSWORD_HASH=${SIMPLESAML_ADMIN_PASSWORD_HASH}
      - CLIP_SERVICE_URL=http://clip:8000
      - FACES_SERVICE_URL=http://faces:8001
    depends_on:
      - mariadb
      - clip
      - faces
    volumes:
      - rs_assets:/var/www/html/filestore
    networks:
      - frontend
      - backend
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resourcespace.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.resourcespace.entrypoints=websecure"
      - "traefik.http.routers.resourcespace.tls.certresolver=letsencrypt"
      - "traefik.http.services.resourcespace.loadbalancer.server.port=80"

  clip:
    build: ./clip
    restart: unless-stopped
    environment:
      - CLIP_DB_HOST=mariadb
      - CLIP_DB_USER=${MYSQL_ROOT_USER}
      - CLIP_DB_PASS=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mariadb
    volumes:
      - clip_cache:/root/.cache
    networks:
      - backend

  faces:
    build: ./faces
    restart: unless-stopped
    environment:
      - FACES_DB_HOST=mariadb
      - FACES_DB_USER=${MYSQL_ROOT_USER}
      - FACES_DB_PASS=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mariadb
    volumes:
      - faces_models:/root/.insightface
    networks:
      - backend

  mariadb:
    image: mariadb
    restart: unless-stopped
    environment:
      - DB_HOST=mariadb
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MYSQL_DATABASE}
      - MARIADB_USER=${MYSQL_READ_ONLY_USER}
      - MARIADB_PASSWORD=${MYSQL_READ_ONLY_PASSWORD}
      - SCRAMBLE_KEY=${SCRAMBLE_KEY}
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - backend

  adminer:
    image: adminer
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # Backup sidecar: stages consistent DB dumps + a filestore mirror onto the
  # `backups` volume on a schedule. An off-site box pulls that volume over
  # rsync/SSH. See docs/backups.md and docs/onprem-pull-setup.md.
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      - TZ=${BACKUP_TZ:-America/Los_Angeles}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_ON_START=${BACKUP_ON_START:-false}
      # Optional: an age public key. If set, an encrypted secrets snapshot is
      # included in each backup so it is self-contained. Leave blank to skip.
      - BACKUP_SECRETS_AGE_RECIPIENT=${BACKUP_SECRETS_AGE_RECIPIENT:-}
      # DB connection (root, for a full dump) + secrets for the optional snapshot.
      - MYSQL_SERVER=${MYSQL_SERVER}
      - MYSQL_ROOT_USER=${MYSQL_ROOT_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_READ_ONLY_USER=${MYSQL_READ_ONLY_USER}
      - MYSQL_READ_ONLY_PASSWORD=${MYSQL_READ_ONLY_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DB_NAME=${DB_NAME}
      - SCRAMBLE_KEY=${SCRAMBLE_KEY}
      - API_SCRAMBLE_KEY=${API_SCRAMBLE_KEY}
      - EMAIL_NOTIFY=${EMAIL_NOTIFY}
      - EMAIL_FROM=${EMAIL_FROM}
      - SIMPLESAML_ADMIN_PASSWORD_HASH=${SIMPLESAML_ADMIN_PASSWORD_HASH}
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      - mariadb
    volumes:
      - rs_assets:/data/filestore:ro   # read-only: the sidecar never writes assets
      - backups:/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 15m

networks:
  frontend:
  backend:
  dokploy-network:
    external: true

volumes:
  mariadb:
  rs_assets:
  clip_cache:
  faces_models:
  backups:
