; SDFWA: upload limits for ResourceSpace (#37, decided in #18).
; Videos up to 1 GB are allowed, so a single file needs 1G and the whole
; multipart POST needs a little more for the other form fields and boundaries.
; Apache's LimitRequestBody (see Dockerfile) must stay >= post_max_size.
upload_max_filesize = 1G
post_max_size = 1100M
